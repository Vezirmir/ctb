<div class="f{% if wide %} wide{% endif %}{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
    {{ field }}
    {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
</div>
